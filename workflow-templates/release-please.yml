# Versiones y changelog en todo repo (mariomina/2-cerebro#276). Necesita release-please-config.json y
# .release-please-manifest.json en la raíz (copiarlos de Escala-Agencia/plantilla-cliente).
name: release-please

on:
  push:
    branches: [$default-branch]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: ${{ !github.event.repository.is_template }}
    uses: mariomina/.github/.github/workflows/release-please.yml@v1
