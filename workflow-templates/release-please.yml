# Solo en productos. Necesita «Allow GitHub Actions to create and approve pull requests».
name: release-please

on:
  push:
    branches: [$default-branch]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    if: ${{ !github.event.repository.is_template }}
    uses: mariomina/.github/.github/workflows/release-please.yml@main
